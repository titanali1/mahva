<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: https: http:; media-src 'self' blob: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: http:;" />
  <title>TakhtLive</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- custom window title bar (Windows 11 window controls overlay on the other side) -->
    <header class="titlebar">
      <div class="titlebar__drag">
        <img class="titlebar__logo" src="../assets/icon-256.png" alt="" />
        <div class="titlebar__titles">
          <span id="app-name" class="titlebar__name">تخت لایو</span>
          <span id="app-tagline" class="titlebar__tagline">پخش زندهٔ کانال‌های ماهواره‌ای</span>
        </div>
      </div>
      <div class="titlebar__actions">
        <button id="btn-search" class="icon-btn" title="" data-i18n-title="search">🔍</button>
        <button id="btn-library" class="icon-btn" title="" data-i18n-title="myChannels">♥</button>
        <button id="btn-add" class="icon-btn" title="" data-i18n-title="addChannel">＋</button>
        <button id="btn-menu" class="icon-btn icon-btn--menu" title="" data-i18n-title="menu">☰</button>
      </div>
    </header>

    <div class="body">
      <!-- navigation drawer -->
      <aside id="drawer" class="drawer" aria-label="menu">
        <div class="drawer__hero">
          <div class="drawer__hero-title">
            <span class="drawer__hero-icon">▶</span>
            <span id="drawer-app-name">تخت لایو</span>
          </div>
          <p id="drawer-tagline" class="drawer__hero-sub"></p>
        </div>

        <h3 id="drawer-sections-label" class="drawer__label">بخش‌ها</h3>
        <nav id="drawer-sections" class="drawer__nav"></nav>

        <div class="drawer__divider"></div>
        <nav class="drawer__nav">
          <button class="drawer__item" data-action="search"><span class="drawer__icon">🔍</span><span data-i18n="search">جستجو</span></button>
          <button class="drawer__item" data-action="library"><span class="drawer__icon">♥</span><span data-i18n="myChannels">کانال‌های من</span></button>
          <button class="drawer__item" data-action="add"><span class="drawer__icon">＋</span><span data-i18n="addChannel">افزودن کانال</span></button>
        </nav>

        <div class="drawer__divider"></div>
        <h3 id="drawer-settings-label" class="drawer__label">تنظیمات</h3>

        <div class="drawer__field">
          <span data-i18n="language">زبان</span>
          <div id="language-chips" class="chips"></div>
        </div>
        <div class="drawer__field">
          <span data-i18n="theme">تم</span>
          <div id="theme-chips" class="chips"></div>
        </div>

        <div class="drawer__divider"></div>
        <h3 id="drawer-about-label" class="drawer__label">درباره</h3>
        <p id="about-line" class="drawer__about"></p>
        <p id="about-system" class="drawer__about drawer__about--muted"></p>
        <div class="signature" id="drawer-signature">✦ طراحی و توسعه dmj74 ✦</div>
      </aside>

      <!-- main content -->
      <main id="content" class="content"></main>
    </div>

    <!-- always visible developer signature (bottom of the app) -->
    <footer class="signature-bar" id="signature-bar">طراحی و توسعه dmj74</footer>
  </div>

  <!-- player layer -->
  <div id="player" class="player hidden">
    <video id="video" class="player__video" playsinline></video>

    <div class="player__topbar">
      <button id="player-back" class="icon-btn icon-btn--dark">←</button>
      <img id="player-logo" class="player__logo" alt="" />
      <div class="player__meta">
        <span id="player-title">—</span>
        <span id="player-category" class="player__category"></span>
      </div>
      <span class="badge badge--live" id="player-live">زنده</span>
      <div class="player__spacer"></div>
      <button id="player-fav" class="icon-btn icon-btn--dark">♥</button>
      <button id="player-copy" class="icon-btn icon-btn--dark" id="copy">⧉</button>
      <button id="player-pip" class="icon-btn icon-btn--dark">▣</button>
      <button id="player-fullscreen" class="icon-btn icon-btn--dark">⛶</button>
      <div class="menu-wrap">
        <button id="player-menu-btn" class="icon-btn icon-btn--dark">⋮</button>
        <div id="player-menu" class="menu hidden"></div>
      </div>
    </div>

    <div id="player-status" class="player__status">
      <div class="spinner"></div>
      <p id="player-status-text">در حال اتصال…</p>
    </div>

    <div id="player-error" class="player__error hidden">
      <div class="player__error-icon">⚠</div>
      <p id="player-error-text"></p>
      <div class="player__error-actions">
        <button id="player-retry" class="btn btn--primary">تلاش دوباره</button>
        <button id="player-back2" class="btn">بازگشت به فهرست</button>
        <button id="player-external" class="btn">پخش با پخش‌کنندهٔ دیگر (VLC)</button>
      </div>
    </div>

    <div class="player__zapping">
      <button id="zap-prev" class="zap">‹ <span id="zap-prev-label"></span></button>
      <button id="zap-next" class="zap"><span id="zap-next-label"></span> ›</button>
    </div>
  </div>

  <!-- add channel dialog -->
  <div id="dialog" class="modal hidden">
    <div class="modal__card">
      <h2 id="dialog-title">افزودن کانال جدید</h2>
      <p id="dialog-hint" class="modal__hint"></p>
      <label class="modal__field">
        <span data-i18n="channelName">نام کانال</span>
        <input id="dialog-name" type="text" />
      </label>
      <label class="modal__field">
        <span data-i18n="streamUrl">آدرس پخش</span>
        <input id="dialog-url" type="text" spellcheck="false" />
      </label>
      <p id="dialog-error" class="modal__error hidden"></p>
      <p class="modal__field-label" data-i18n="whichSection">این کانال در کدام بخش نمایش داده شود؟</p>
      <div id="dialog-sections" class="chips chips--wrap"></div>
      <div class="modal__actions">
        <button id="dialog-cancel" class="btn">انصراف</button>
        <button id="dialog-confirm" class="btn btn--primary">افزودن</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="../src/i18n.js"></script>
  <script src="hls.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
