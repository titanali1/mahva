name: Build APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk  "out/mahva-tv-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "out/mahva-tv-release.apk" || true
          ls -lh out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mahva-tv-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling "latest" release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/arena/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Mahva TV – APK (آخرین نسخه)
          body: |
            نسخهٔ آمادهٔ نصب برنامهٔ **ماهوا** (Mahva TV).

            فایل `mahva-tv-release.apk` را روی گوشی اندروید نصب کنید
            (نصب از منابع نامعتبر را در تنظیمات اجازه دهید).

            کانال‌ها: پرشیانا گروپ، خبری، موزیک، ورزشی
          files: out/*.apk
          make_latest: true
          prerelease: false
