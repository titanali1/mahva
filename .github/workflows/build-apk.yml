name: Build APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee build-debug.log

      # Renders the real UI on the JVM (Robolectric) and writes screenshots to
      # docs/screenshots. Also acts as a smoke test for the whole app.
      - name: Run unit tests and capture screenshots
        id: unit_tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest 2>&1 | tee build-tests.log

      - name: Build release APK
        id: build_release
        if: steps.build_debug.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleRelease 2>&1 | tee build-release.log

      # Failures are surfaced as check-run annotations, which stay readable even
      # when the raw job logs are not reachable.
      - name: Report compiler and test errors
        if: failure() || steps.unit_tests.outcome == 'failure'
        run: |
          set +e
          cat build-debug.log build-release.log build-tests.log 2>/dev/null \
            | grep -E "^(e: |error:|Execution failed|\* What went wrong:|Caused by:|> Task .*FAILED|BUILD FAILED)" \
            | head -45 > errors.txt
          if [ ! -s errors.txt ]; then
            tail -c 3000 build-debug.log 2>/dev/null >> errors.txt
          fi
          while IFS= read -r line; do
            clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g' | cut -c1-900)
            echo "::error::$clean"
          done < errors.txt

      # The raw job logs are not always reachable from outside, so the relevant
      # part of the build output is committed to ci-logs/ instead.
      - name: Store build logs in the repository
        if: failure() || steps.unit_tests.outcome == 'failure'
        run: |
          set +e
          mkdir -p ci-logs
          {
            echo "### build-debug.log"
            grep -E "^(e: |error:|Execution failed|> Task .*FAILED|\* What went wrong:)" build-debug.log 2>/dev/null | head -60
            echo
            echo "### build-tests.log"
            grep -E "^(e: |error:|> Task .*FAILED|.*FAILED|.*AssertionError|.*Exception|\* What went wrong:)" build-tests.log 2>/dev/null | head -120
            echo
            echo "### build-release.log"
            grep -E "^(e: |error:|Execution failed|> Task .*FAILED|\* What went wrong:)" build-release.log 2>/dev/null | head -40
            echo
            echo "### tail of build-tests.log"
            tail -c 6000 build-tests.log 2>/dev/null
            echo
            echo "### tail of build-debug.log"
            tail -c 4000 build-debug.log 2>/dev/null
          } > ci-logs/errors.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-logs
          git diff --cached --quiet && echo "no error log changes" && exit 0
          git commit -m "CI error log [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Commit screenshots back to the branch
        if: always()
        run: |
          set +e
          ls -la docs/screenshots || true
          if [ -d docs/screenshots ] && [ -n "$(ls -A docs/screenshots 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f docs/screenshots
            git diff --cached --quiet && echo "no screenshot changes" && exit 0
            git commit -m "Update app screenshots [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Collect APKs
        if: steps.build_debug.outcome == 'success'
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/mahva-tv-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "out/mahva-tv-release.apk" || true
          ls -lh out

      - name: Upload APK artifacts
        if: steps.build_debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mahva-tv-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling "latest" release
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Mahva TV – APK (آخرین نسخه)
          body: |
            نسخهٔ آمادهٔ نصب برنامهٔ **ماهوا** (Mahva TV).

            فایل `mahva-tv-release.apk` را روی گوشی اندروید نصب کنید
            (برای این کار باید نصب از منابع ناشناس را در تنظیمات اجازه دهید).

            بخش‌ها: پرشیانا گروپ، خبری، موزیک، ورزشی
          files: out/*.apk
          make_latest: true
          prerelease: false
