name: Build Windows app

# Windows 11 desktop build of TakhtLive (Electron).
#  - verifies the UI (unit tests + a real Chromium render of every screen) and
#    commits the freshly rendered screenshots back to the branch
#  - builds the NSIS installer and the portable .exe on a Windows runner
#  - publishes them to the rolling "windows-latest" release

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ UI check
  ui:
    name: Verify UI (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Sync shared assets from the Android app
        working-directory: .
        run: python3 tools/sync_windows_assets.py

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        id: unit_tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-windows.log

      # Renders every screen with the very same HTML/CSS/JS that Electron loads
      # and fails on any JavaScript error.
      - name: Render all screens
        id: screenshots
        run: |
          set -o pipefail
          # the runner has internet access, so keep the real channel logos in the
          # screenshots that get committed back to the branch
          SHOTS_KEEP_LOGOS=1 npm run screenshots 2>&1 | tee screenshots-windows.log

      - name: Report failures as annotations
        if: failure()
        working-directory: .
        run: |
          set +e
          cat windows/test-windows.log windows/screenshots-windows.log 2>/dev/null \
            | grep -E "^(not ok|# fail|Error|TypeError|AssertionError|javascript errors|renderer did not render)" \
            | head -40 > windows-errors.txt
          while IFS= read -r line; do
            clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g' | cut -c1-900)
            echo "::error::$clean"
          done < windows-errors.txt

      # A short summary, committed to the repo so the result stays readable
      # without access to the raw job logs.
      - name: Windows test summary
        if: always()
        working-directory: .
        run: |
          set +e
          mkdir -p ci-logs
          {
            echo "# Windows app summary - $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "## Unit tests"
            echo '```'
            tail -n 12 windows/test-windows.log 2>/dev/null
            echo '```'
            echo "## UI render (headless Chromium)"
            echo '```'
            tail -n 8 windows/screenshots-windows.log 2>/dev/null
            echo '```'
            echo "screenshots:"
            ls -la docs/screenshots/windows/*.png 2>/dev/null | awk '{print "- " $9 " (" $5 " bytes)"}'
          } > ci-logs/windows-summary.txt
          cat ci-logs/windows-summary.txt

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: takhtlive-windows-screenshots
          path: docs/screenshots/windows/
          if-no-files-found: warn
          retention-days: 30

      # The runner has full internet access, so the committed screenshots show
      # the real channel logos (a sandboxed machine falls back to the app icon).
      - name: Commit the rendered screenshots
        if: steps.screenshots.outcome == 'success'
        working-directory: .
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/screenshots/windows ci-logs/windows-summary.txt
          git diff --cached --quiet && echo "no changes to commit" && exit 0
          git commit -m "Update Windows screenshots [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # ------------------------------------------------------------- Windows build
  build:
    name: Build Windows installer
    needs: ui
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Sync shared assets from the Android app
        working-directory: .
        run: python tools/sync_windows_assets.py

      - name: Install dependencies
        run: npm ci

      - name: Vendor runtime libraries (hls.js)
        run: npm run vendor

      - name: Build installer and portable app
        run: npm run build

      - name: List build output
        run: dir dist

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: takhtlive-windows
          path: windows/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling "windows-latest" release
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: TakhtLive – Windows 11 (آخرین نسخه)
          body: |
            نسخهٔ دسکتاپ **تخت لایو** برای ویندوز ۱۱ (۶۴ بیتی).

            - `TakhtLive-Setup-*.exe` — نصب‌کنندهٔ کامل (میان‌بر روی دسکتاپ و منوی استارت می‌سازد)
            - `TakhtLive-*-portable.exe` — نسخهٔ بدون نصب

            اگر ویندوز پیام SmartScreen نشان داد، روی **More info ▸ Run anyway** بزنید.

            بخش‌ها: پرشیانا گروپ، خبری، موزیک، ورزشی — با همان ۱۰۹ کانال نسخهٔ اندروید.
          files: windows/dist/*.exe
          make_latest: false
          prerelease: false
