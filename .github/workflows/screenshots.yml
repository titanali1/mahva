name: Emulator smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths-ignore:
      - 'docs/**'
      - 'ci-logs/**'
      - '**.md'

permissions:
  contents: write

jobs:
  emulator:
    name: Install + launch the APK on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator and system image
        run: |
          mkdir -p ci-logs docs/screenshots/emulator
          {
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "PATH=$PATH"
            echo "--- which ---"
            for tool in sdkmanager avdmanager adb emulator; do
              printf '%s -> %s\n' "$tool" "$(command -v "$tool" || echo NOT_FOUND)"
            done
            echo "--- sdk layout ---"
            ls "$ANDROID_SDK_ROOT" 2>&1
            ls "$ANDROID_SDK_ROOT/cmdline-tools" 2>&1
          } > ci-logs/env.txt

          yes | sdkmanager --licenses > ci-logs/sdkmanager.log 2>&1
          sdkmanager --install "platform-tools" "emulator" \
            "system-images;android-34;google_apis;x86_64" >> ci-logs/sdkmanager.log 2>&1
          tail -5 ci-logs/sdkmanager.log
          echo "--- installed packages ---" >> ci-logs/env.txt
          sdkmanager --list_installed >> ci-logs/env.txt 2>&1

      - name: Boot the emulator
        run: |
          EMULATOR_BIN="${ANDROID_SDK_ROOT}/emulator/emulator"
          test -x "$EMULATOR_BIN" || EMULATOR_BIN="$(command -v emulator)"
          echo "using emulator binary: $EMULATOR_BIN" | tee -a ci-logs/env.txt
          echo no | avdmanager create avd -n mahva -k "system-images;android-34;google_apis;x86_64" \
            -d pixel_5 --force > ci-logs/avdmanager.log 2>&1
          avdmanager list avd >> ci-logs/avdmanager.log 2>&1
          nohup "$EMULATOR_BIN" -avd mahva -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none \
            > ci-logs/emulator-boot.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 90); do
            state=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "attempt $i: sys.boot_completed='$state'"
            [ "$state" = "1" ] && break
            sleep 5
          done
          adb shell getprop sys.boot_completed
          adb shell wm size

      - name: Install the app, drive the UI and capture screenshots
        run: |
          mkdir -p docs/screenshots/emulator ci-logs
          {
            echo "--- install ---"
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            echo "--- launch ---"
            adb shell am start -n ir.mahva.tv/.MainActivity
            sleep 30
            adb exec-out screencap -p > docs/screenshots/emulator/01-home.png

            # Bottom navigation tabs (RTL layout: home is the right-most item)
            for pair in "756:02-persiana" "540:03-news" "324:04-music" "108:05-sports"; do
              x="${pair%%:*}"; name="${pair##*:}"
              echo "--- tapping tab at x=$x ---"
              adb shell input tap "$x" 2182
              sleep 8
              adb exec-out screencap -p > "docs/screenshots/emulator/$name.png"
            done

            echo "--- opening the first channel of the current section ---"
            adb shell input tap 830 700
            sleep 20
            adb exec-out screencap -p > docs/screenshots/emulator/06-player.png

            echo "--- app process (must still be alive) ---"
            adb shell pidof ir.mahva.tv || echo "APP_NOT_RUNNING"

            echo "--- crashes ---"
            adb logcat -d -b crash | tail -40
            echo "--- app log ---"
            adb logcat -d | grep -i -E "mahva|AndroidRuntime|ExoPlayer|MediaCodec" | tail -60
            echo "--- files ---"
            ls -la docs/screenshots/emulator
          } 2>&1 | tee -a ci-logs/emulator.log

      - name: Commit screenshots and the emulator log
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f ci-logs/emulator.log ]; then
            tail -c 60000 ci-logs/emulator.log > ci-logs/emulator-tail.log
            mv ci-logs/emulator-tail.log ci-logs/emulator.log
            git add -f ci-logs/emulator.log
            grep -i -E "error|failed|exception|crash" ci-logs/emulator.log | head -20 | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g' | cut -c1-900)
              echo "::warning::$clean"
            done
          fi

          git add -f ci-logs/sdkmanager.log ci-logs/avdmanager.log \
            ci-logs/emulator-boot.log ci-logs/env.txt 2>/dev/null

          if [ -d docs/screenshots/emulator ] && [ -n "$(ls -A docs/screenshots/emulator 2>/dev/null)" ]; then
            git add -f docs/screenshots/emulator
          else
            echo "::warning::no emulator screenshots were produced"
          fi

          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Update emulator run artifacts [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
