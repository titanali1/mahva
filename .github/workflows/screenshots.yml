name: Emulator smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths-ignore:
      - 'docs/**'
      - 'ci-logs/**'
      - '**.md'

permissions:
  contents: write

jobs:
  emulator:
    name: Install + launch the APK on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug

      - name: Enable KVM
        run: |
          sudo mkdir -p /etc/udev/rules.d
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true

      # Locates (or installs) the Android SDK tools and exports them through
      # GITHUB_ENV / GITHUB_OUTPUT. Everything is written to ci-logs/env.txt,
      # which gets committed, so failures stay diagnosable.
      - name: Locate the Android SDK tools
        id: locate
        run: |
          set +e
          mkdir -p ci-logs docs/screenshots/emulator
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo "PATH=$PATH"
            echo "--- which ---"
            for tool in sdkmanager avdmanager adb emulator java; do
              printf '%s -> %s\n' "$tool" "$(command -v "$tool" || echo NOT_FOUND)"
            done
            echo "--- candidate SDK roots ---"
            for candidate in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" /usr/local/lib/android/sdk \
                             /opt/android-sdk "$HOME/Android/Sdk"; do
              [ -n "$candidate" ] && echo "$candidate: $(ls -d "$candidate" 2>/dev/null || echo missing)"
            done
            echo "--- find sdkmanager / emulator ---"
            find / -maxdepth 7 -name sdkmanager -type f 2>/dev/null | head -5
            find / -maxdepth 7 -path "*emulator/emulator" -type f 2>/dev/null | head -5
          } > ci-logs/env.txt

          SDK=""
          for candidate in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" /usr/local/lib/android/sdk \
                           /opt/android-sdk "$HOME/Android/Sdk"; do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then SDK="$candidate"; break; fi
          done
          if [ -z "$SDK" ]; then
            SDK="$(find / -maxdepth 7 -path "*emulator/emulator" -type f 2>/dev/null \
                   | head -1 | xargs dirname 2>/dev/null | xargs dirname 2>/dev/null)"
          fi
          if [ -z "$SDK" ]; then SDK="$HOME/android-sdk"; mkdir -p "$SDK"; fi
          echo "SDK_ROOT=$SDK" >> ci-logs/env.txt

          CMDLINE_BIN=""
          for candidate in "$SDK/cmdline-tools/latest/bin" "$SDK/cmdline-tools/bin" "$SDK/bin"; do
            if [ -x "$candidate/sdkmanager" ]; then CMDLINE_BIN="$candidate"; break; fi
          done
          if [ -z "$CMDLINE_BIN" ]; then
            existing="$(find / -maxdepth 7 -name sdkmanager -type f 2>/dev/null | head -1)"
            [ -n "$existing" ] && CMDLINE_BIN="$(dirname "$existing")"
          fi

          EMULATOR_BIN="$SDK/emulator/emulator"
          [ -x "$EMULATOR_BIN" ] || EMULATOR_BIN="$(find / -maxdepth 7 -path "*emulator/emulator" -type f 2>/dev/null | head -1)"

          {
            echo "CMDLINE_BIN=$CMDLINE_BIN"
            echo "EMULATOR_BIN=$EMULATOR_BIN"
          } >> ci-logs/env.txt

          echo "SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "CMDLINE_BIN=$CMDLINE_BIN" >> "$GITHUB_ENV"
          echo "EMULATOR_BIN=$EMULATOR_BIN" >> "$GITHUB_ENV"
          echo "SDK_ROOT=$SDK" >> "$GITHUB_OUTPUT"
          echo "CMDLINE_BIN=$CMDLINE_BIN" >> "$GITHUB_OUTPUT"
          echo "EMULATOR_BIN=$EMULATOR_BIN" >> "$GITHUB_OUTPUT"
          tail -8 ci-logs/env.txt

      - name: Install emulator and system image when missing
        run: |
          set +e
          {
            echo "--- install step ---"
            if [ -x "$EMULATOR_BIN" ]; then
              echo "emulator already present: $EMULATOR_BIN"
            else
              echo "downloading Android command line tools"
              mkdir -p "$SDK_ROOT/cmdline-tools"
              curl -sSLo /tmp/cmdline-tools.zip \
                https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-unpacked
              rm -rf "$SDK_ROOT/cmdline-tools/latest"
              mv /tmp/cmdline-tools-unpacked/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
              CMDLINE_BIN="$SDK_ROOT/cmdline-tools/latest/bin"
              echo "CMDLINE_BIN=$CMDLINE_BIN" >> "$GITHUB_ENV"
            fi

            if [ -n "$CMDLINE_BIN" ] && [ -x "$CMDLINE_BIN/sdkmanager" ]; then
              yes | "$CMDLINE_BIN/sdkmanager" --sdk_root="$SDK_ROOT" --licenses
              "$CMDLINE_BIN/sdkmanager" --sdk_root="$SDK_ROOT" --install \
                "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64"
              "$CMDLINE_BIN/sdkmanager" --sdk_root="$SDK_ROOT" --list_installed
            else
              echo "sdkmanager not available, assuming the runner image ships the SDK"
            fi
          } >> ci-logs/env.txt 2>&1
          tail -20 ci-logs/env.txt

      - name: Boot the emulator
        run: |
          set +e
          export PATH="$CMDLINE_BIN:$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$PATH"
          : > ci-logs/emulator-boot.log
          {
            echo "SDK_ROOT=$SDK_ROOT"
            echo "emulator: $(command -v emulator || echo "$EMULATOR_BIN")"
            echo "adb: $(command -v adb)"

            AVD_NAME=takhtlive
            echo no | avdmanager create avd -n "$AVD_NAME" \
              -k "system-images;android-34;google_apis;x86_64" -d pixel_5 --force
            avdmanager list avd

            nohup emulator -avd "$AVD_NAME" -no-window -no-audio -no-boot-anim -no-snapshot \
              -gpu swiftshader_indirect -camera-back none -camera-front none \
              >> ci-logs/emulator-boot.log 2>&1 &

            adb start-server
            adb wait-for-device
            for i in $(seq 1 90); do
              state=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              echo "attempt $i: sys.boot_completed='$state'"
              [ "$state" = "1" ] && break
              sleep 5
            done
            adb shell getprop sys.boot_completed
            adb shell wm size
          } >> ci-logs/emulator-boot.log 2>&1
          tail -15 ci-logs/emulator-boot.log

      - name: Install the app, drive the UI and capture screenshots
        run: |
          set +e
          export PATH="$CMDLINE_BIN:$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$PATH"
          {
            echo "--- install ---"
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            echo "--- launch ---"
            adb shell am start -n ir.takhtlive.tv/.MainActivity
            sleep 30
            adb exec-out screencap -p > docs/screenshots/emulator/01-home.png

            # Bottom navigation tabs (RTL layout: home is the right-most item)
            for pair in "756:02-persiana" "540:03-news" "324:04-music" "108:05-sports"; do
              x="${pair%%:*}"; name="${pair##*:}"
              echo "--- tapping tab at x=$x ---"
              adb shell input tap "$x" 2182
              sleep 8
              adb exec-out screencap -p > "docs/screenshots/emulator/$name.png"
            done

            echo "--- opening the first channel of the current section ---"
            adb shell input tap 830 700
            sleep 20
            adb exec-out screencap -p > docs/screenshots/emulator/06-player.png

            echo "--- app process (must still be alive) ---"
            adb shell pidof ir.takhtlive.tv || echo "APP_NOT_RUNNING"

            echo "--- crashes ---"
            adb logcat -d -b crash | tail -40
            echo "--- app log ---"
            adb logcat -d | grep -i -E "takhtlive|AndroidRuntime|ExoPlayer|MediaCodec" | tail -60
            echo "--- files ---"
            ls -la docs/screenshots/emulator
          } 2>&1 | tee -a ci-logs/emulator.log

      - name: Commit screenshots and the emulator log
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f ci-logs/emulator.log ]; then
            tail -c 60000 ci-logs/emulator.log > /tmp/t.log && mv /tmp/t.log ci-logs/emulator.log
          fi
          git add -f ci-logs/emulator.log ci-logs/env.txt ci-logs/emulator-boot.log 2>/dev/null

          if [ -d docs/screenshots/emulator ] && [ -n "$(ls -A docs/screenshots/emulator 2>/dev/null)" ]; then
            git add -f docs/screenshots/emulator
          else
            echo "::warning::no emulator screenshots were produced"
          fi

          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Update emulator run artifacts [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
